spring:
  application:
    name: dangcharge
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        # 목록에서 지원 차종 같은 지연 로딩 컬렉션을 충전소마다 따로 조회하지 않고 IN 쿼리 한 번으로 가져온다
        default_batch_fetch_size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 없을 때 전송이 오래 붙잡히지 않게 한다
        max.block.ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

dangcharge:
  jwt:
    issuer: dangcharge
    # RSA 키(PEM 또는 Base64). 비어 있으면 기동할 때마다 임시 키를 만든다
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  admin:
    # 관리 API(X-Admin-Key) 키. 비어 있으면 관리 API를 아무도 호출할 수 없다
    api-key: ${ADMIN_API_KEY:}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: 1000
  station-sync:
    # 레플리카마다 돌기 때문에 한 곳에서만 켠다
    enabled: ${STATION_SYNC_ENABLED:false}
    cron: ${STATION_SYNC_CRON:0 0 4 * * *}
  station-import:
    enabled: ${STATION_IMPORT_ENABLED:false}
    csv-path: ${STATION_IMPORT_CSV_PATH:data/ev_charge_stations.csv}
