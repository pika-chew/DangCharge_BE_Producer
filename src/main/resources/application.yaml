spring:
  application:
    name: dangcharge
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        # 목록에서 지원 차종 같은 지연 로딩 컬렉션을 충전소마다 따로 조회하지 않고 IN 쿼리 한 번으로 가져온다
        default_batch_fetch_size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 없을 때 전송이 오래 붙잡히지 않게 한다
        max.block.ms: 5000

management:
  endpoints:
    web:
      exposure:
        # 헬스 체크만 연다. 다른 actuator 엔드포인트(env, beans 등)는 노출하지 않는다
        include: health
  endpoint:
    health:
      # k8s probe용 경로. k8s 밖(로컬, 도커)에서도 같은 경로를 쓰도록 항상 켠다
      #   liveness:  /actuator/health/liveness  — 앱이 살아 있는지. 실패하면 파드 재시작
      #   readiness: /actuator/health/readiness — 요청을 받을 수 있는지. 실패하면 트래픽에서 제외
      probes:
        enabled: true
      group:
        readiness:
          # DB에 붙지 못하면 요청을 받지 않는다. liveness에는 넣지 않아 DB 장애로 파드가 재시작되지 않게 한다
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

dangcharge:
  jwt:
    # RSA 키(PEM 또는 Base64). 비어 있으면 기동할 때마다 임시 키를 만든다. 유효기간은 액세스 30분, 리프레시 14일
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  admin:
    # 관리 API(X-Admin-Key) 키. 비어 있으면 관리 API를 아무도 호출할 수 없다
    api-key: ${ADMIN_API_KEY:}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: 1000
  no-show:
    # 충전 시작 마감(예약 시작 15분 후)이 지난 예약을 NO_SHOW로 바꾼다. 여러 파드에서 돌아도 안전하다
    enabled: ${NO_SHOW_ENABLED:true}
    interval: 60000
  station-sync:
    # 레플리카마다 돌기 때문에 한 곳에서만 켠다
    enabled: ${STATION_SYNC_ENABLED:false}
    cron: ${STATION_SYNC_CRON:0 0 4 * * *}
  station-import:
    enabled: ${STATION_IMPORT_ENABLED:false}
    # 기본은 JAR에 포함된 CSV. 다른 파일은 file:/경로 또는 일반 경로로 지정한다
    csv-path: ${STATION_IMPORT_CSV_PATH:classpath:data/ev_charge_stations.csv}
