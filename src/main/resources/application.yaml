server:
  servlet:
    # 인그레스가 /command를 떼지 않고 넘기므로 앱이 그 경로 아래에서 동작한다. 로컬은 비워 둔다
    context-path: ${SERVER_CONTEXT_PATH:}
  # 인그레스가 붙이는 X-Forwarded-Proto/Host/Port를 믿고 리다이렉트·Swagger 주소를 만든다
  forward-headers-strategy: framework

spring:
  application:
    name: dangcharge
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        # 목록에서 지원 차종 같은 지연 로딩 컬렉션을 충전소마다 따로 조회하지 않고 IN 쿼리 한 번으로 가져온다
        default_batch_fetch_size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 없을 때 전송이 오래 붙잡히지 않게 한다
        max.block.ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

dangcharge:
  jwt:
    # RSA 키(PEM 또는 Base64). 비어 있으면 기동할 때마다 임시 키를 만든다. 유효기간은 액세스 30분, 리프레시 14일
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  admin:
    # 관리 API(X-Admin-Key) 키. 비어 있으면 관리 API를 아무도 호출할 수 없다
    api-key: ${ADMIN_API_KEY:}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: 1000
  station-sync:
    # 레플리카마다 돌기 때문에 한 곳에서만 켠다
    enabled: ${STATION_SYNC_ENABLED:false}
    cron: ${STATION_SYNC_CRON:0 0 4 * * *}
  station-import:
    enabled: ${STATION_IMPORT_ENABLED:false}
    # 기본은 JAR에 포함된 CSV. 다른 파일은 file:/경로 또는 일반 경로로 지정한다
    csv-path: ${STATION_IMPORT_CSV_PATH:classpath:data/ev_charge_stations.csv}
